name: Contribution Snake

on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate light and dark contribution snakes
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: sarhal7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            github-contribution-grid-snake.svg?palette=github
            github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Commit generated snake assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake is already up to date."
          else
            git commit -m "Update contribution snake"
            git push origin HEAD:main
          fi
