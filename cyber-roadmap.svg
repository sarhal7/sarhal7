<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity learning roadmap</title>
  <desc id="desc">Illustrated learning topics: web exploitation, reverse engineering, network analysis, and CTF practice. Animated markers indicate active exploration, not skill percentages.</desc>
  <defs>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="276" rx="18" fill="#0d1117" stroke="#243244"/>
  <text x="26" y="35" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="14" font-weight="700" letter-spacing="1.2">CYBERSECURITY // LEARNING ROADMAP</text>
  <text x="26" y="55" fill="#64748b" font-family="ui-monospace,monospace" font-size="10">ACTIVE EXPLORATION · NOT A PROFICIENCY SCORE</text>
  <g font-family="ui-monospace,monospace" font-size="13" fill="#dbeafe">
    <rect x="22" y="71" width="856" height="42" rx="10" fill="#111c29" stroke="#203146"/>
    <rect x="22" y="120" width="856" height="42" rx="10" fill="#111c29" stroke="#203146"/>
    <rect x="22" y="169" width="856" height="42" rx="10" fill="#111c29" stroke="#203146"/>
    <rect x="22" y="218" width="856" height="42" rx="10" fill="#111c29" stroke="#203146"/>
    <text x="83" y="97">Web exploitation</text>
    <text x="83" y="146">Reverse engineering</text>
    <text x="83" y="195">Network traffic analysis</text>
    <text x="83" y="244">CTF problem-solving</text>
    <text x="302" y="97" fill="#64748b" font-size="10">HTTP · INPUTS · AUTH</text>
    <text x="302" y="146" fill="#64748b" font-size="10">BINARIES · PROGRAM BEHAVIOR</text>
    <text x="302" y="195" fill="#64748b" font-size="10">PACKETS · PROTOCOLS</text>
    <text x="302" y="244" fill="#64748b" font-size="10">PUZZLES · TEAMWORK</text>
  </g>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- browser / web icon -->
    <rect x="39" y="82" width="29" height="22" rx="4" stroke="#38bdf8"/><path d="M39 89h29M45 86h.1M50 86h.1M55 86h.1M47 97l-4 3 4 3M60 97l4 3-4 3M56 96l-4 8" stroke="#38bdf8"/>
    <!-- reverse / chip icon -->
    <rect x="44" y="129" width="20" height="23" rx="4" stroke="#a78bfa"/><path d="M49 135h10v11H49zM49 125v4M59 125v4M49 152v4M59 152v4M40 135h4M40 145h4M64 135h4M64 145h4" stroke="#a78bfa"/>
    <!-- network nodes icon -->
    <circle cx="54" cy="190" r="5" stroke="#34d399"/><circle cx="43" cy="180" r="3" stroke="#34d399"/><circle cx="65" cy="180" r="3" stroke="#34d399"/><circle cx="43" cy="201" r="3" stroke="#34d399"/><circle cx="65" cy="201" r="3" stroke="#34d399"/><path d="M50 187l-5-5m13 5 5-5m-12 7-6 5m12-5 6 5" stroke="#34d399"/>
    <!-- flag / CTF icon -->
    <path d="M45 252v-24m1 2q10-6 19 0v12q-9-6-19 0" stroke="#fbbf24"/><path d="M51 234h9M51 239h7" stroke="#fbbf24"/>
  </g>
  <g fill="#17212b">
    <rect x="594" y="89" width="250" height="8" rx="4"/><rect x="594" y="138" width="250" height="8" rx="4"/><rect x="594" y="187" width="250" height="8" rx="4"/><rect x="594" y="236" width="250" height="8" rx="4"/>
  </g>
  <g fill="url(#glow)" filter="url(#soft)">
    <circle cy="93" r="5"><animate attributeName="cx" values="600;838;600" dur="4s" repeatCount="indefinite"/></circle>
    <circle cy="142" r="5"><animate attributeName="cx" values="600;838;600" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cy="191" r="5"><animate attributeName="cx" values="600;838;600" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cy="240" r="5"><animate attributeName="cx" values="600;838;600" dur="5.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
