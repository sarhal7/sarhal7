<svg xmlns="http://www.w3.org/2000/svg" width="540" height="354" viewBox="0 0 540 354" role="img" aria-labelledby="title desc">
  <title id="title">Security field notes: learning map</title>
  <desc id="desc">A four-topic learning map covering web exploitation, reverse engineering, network analysis, and CTF problem-solving. The numbered stops are themes, not proficiency rankings.</desc>
  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63d6c5"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="538" height="352" rx="20" fill="#111a22" stroke="#2b3941" stroke-width="2"/>
  <path d="M24 72H516" stroke="#2b3941" stroke-width="1"/>

  <text x="27" y="32" fill="#78d8c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.6">FIELD NOTES  /  SECURITY</text>
  <text x="27" y="59" fill="#f3f0e8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">A map of what I'm learning</text>
  <text x="513" y="34" text-anchor="end" fill="#aab6b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".6">CTFs · LABS · PRACTICE</text>

  <path d="M48 112V296" fill="none" stroke="#53635f" stroke-width="2" stroke-dasharray="3 7"/>
  <path d="M48 112V296" fill="none" stroke="url(#route)" stroke-width="2" stroke-dasharray="26 158" stroke-linecap="round" opacity=".85">
    <animate attributeName="stroke-dashoffset" values="0;-184" dur="8s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="75" y="86" width="438" height="58" rx="10" fill="#18242b" stroke="#30434a"/>
    <circle cx="48" cy="115" r="13" fill="#172a2a" stroke="#63d6c5" stroke-width="2"/>
    <text x="48" y="119" text-anchor="middle" fill="#9ce7d9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">01</text>
    <text x="94" y="110" fill="#f3f0e8" font-size="16" font-weight="700">Web exploitation</text>
    <text x="94" y="130" fill="#aab6b2" font-size="12">HTTP · input handling · authentication</text>
    <path d="M480 108l6 7-6 7" fill="none" stroke="#63d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="75" y="151" width="438" height="58" rx="10" fill="#18242b" stroke="#30434a"/>
    <circle cx="48" cy="180" r="13" fill="#25202a" stroke="#c8a2e8" stroke-width="2"/>
    <text x="48" y="184" text-anchor="middle" fill="#dfc5f3" font-family="ui-monospace, monospace" font-size="10" font-weight="700">02</text>
    <text x="94" y="175" fill="#f3f0e8" font-size="16" font-weight="700">Reverse engineering</text>
    <text x="94" y="195" fill="#aab6b2" font-size="12">Binaries · behavior · careful analysis</text>
    <path d="M480 173l6 7-6 7" fill="none" stroke="#c8a2e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="75" y="216" width="438" height="58" rx="10" fill="#18242b" stroke="#30434a"/>
    <circle cx="48" cy="245" r="13" fill="#29251e" stroke="#f4b860" stroke-width="2"/>
    <text x="48" y="249" text-anchor="middle" fill="#f9d28f" font-family="ui-monospace, monospace" font-size="10" font-weight="700">03</text>
    <text x="94" y="240" fill="#f3f0e8" font-size="16" font-weight="700">Network analysis</text>
    <text x="94" y="260" fill="#aab6b2" font-size="12">Packets · protocols · traffic patterns</text>
    <path d="M480 238l6 7-6 7" fill="none" stroke="#f4b860" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="75" y="281" width="438" height="58" rx="10" fill="#18242b" stroke="#30434a"/>
    <circle cx="48" cy="310" r="13" fill="#222629" stroke="#a7c4df" stroke-width="2"/>
    <text x="48" y="314" text-anchor="middle" fill="#cfe0ee" font-family="ui-monospace, monospace" font-size="10" font-weight="700">04</text>
    <text x="94" y="305" fill="#f3f0e8" font-size="16" font-weight="700">CTF problem-solving</text>
    <text x="94" y="325" fill="#aab6b2" font-size="12">Puzzles · collaboration · learning by doing</text>
    <path d="M480 303l6 7-6 7" fill="none" stroke="#a7c4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
