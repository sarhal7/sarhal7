        <g><rect x="1416" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#35516a"/><rect x="1424" y="52" width="20" height="20" rx="5" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".7"/><text x="1434" y="66" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="10" font-weight="700">W</text><text x="1453" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="10.7">Wireshark</text></g>
        <g><rect x="1556" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#5c3d68"/><rect x="1564" y="52" width="20" height="20" rx="5" fill="#d946ef" fill-opacity=".14" stroke="#d946ef" stroke-opacity=".7"/><text x="1574" y="66" text-anchor="middle" fill="#e879f9" font-family="ui-monospace,monospace" font-size="10" font-weight="700">M</text><text x="1593" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="10.5">Metasploit</text></g>
        <g><rect x="1696" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#4f4375"/><rect x="1704" y="52" width="20" height="20" rx="5" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".7"/><text x="1714" y="66" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="10" font-weight="700">G</text><text x="1733" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="12.5">Ghidra</text></g>
