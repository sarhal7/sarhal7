        <g><rect x="996" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#3e5262"/><rect x="1004" y="52" width="20" height="20" rx="5" fill="#94a3b8" fill-opacity=".14" stroke="#94a3b8" stroke-opacity=".7"/><text x="1014" y="66" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="10" font-weight="700">K</text><text x="1033" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="11.3">Kali Linux</text></g>
        <g><rect x="1136" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#315841"/><rect x="1144" y="52" width="20" height="20" rx="5" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".7"/><text x="1154" y="66" text-anchor="middle" fill="#86efac" font-family="ui-monospace,monospace" font-size="10" font-weight="700">N</text><text x="1173" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="12.5">Nmap</text></g>
