        <g><rect x="156" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#5b3a55"/><rect x="164" y="52" width="20" height="20" rx="5" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".7"/><text x="174" y="66" text-anchor="middle" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="8.5" font-weight="700">++</text><text x="193" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="13">C++</text></g>
        <g><rect x="296" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#62572e"/><rect x="304" y="52" width="20" height="20" rx="5" fill="#facc15" fill-opacity=".14" stroke="#facc15" stroke-opacity=".7"/><text x="314" y="66" text-anchor="middle" fill="#fde047" font-family="ui-monospace,monospace" font-size="9" font-weight="700">Py</text><text x="333" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="12">Python</text></g>
        <g><rect x="436" y="46" width="128" height="32" rx="8" fill="#111a27" stroke="#653c45"/><rect x="444" y="52" width="20" height="20" rx="5" fill="#fb7185" fill-opacity=".14" stroke="#fb7185" stroke-opacity=".7"/><text x="454" y="66" text-anchor="middle" fill="#fda4af" font-family="ui-monospace,monospace" font-size="8.5" font-weight="700">&lt;/&gt;</text><text x="473" y="67" fill="#dce8f3" font-family="ui-monospace,monospace" font-size="12.5">HTML</text></g>
