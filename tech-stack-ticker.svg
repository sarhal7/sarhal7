<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="102" viewBox="0 0 680 102" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk technology ticker</title>
  <desc id="desc">A smoothly scrolling ticker of C, C++, Python, HTML, CSS, JavaScript, Java, Kali Linux, Nmap, Burp Suite, Wireshark, Metasploit, and Ghidra.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1724"/><stop offset="1" stop-color="#090d16"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5d4" stop-opacity="0"/><stop offset=".5" stop-color="#00f5d4" stop-opacity=".22"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></linearGradient>
    <clipPath id="trackWindow"><rect x="12" y="36" width="656" height="54" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="678" height="100" rx="14" fill="url(#panel)" stroke="#263747" stroke-width="1.5"/>
  <path d="M16 30H664" stroke="#24333f" stroke-width="1"/>
  <circle cx="19" cy="19" r="3" fill="#00f5d4"/>
  <text x="29" y="23" fill="#9bded7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.2">STACK / IN MOTION</text>
  <text x="662" y="23" text-anchor="end" fill="#6d8293" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing=".7">13 NODES · SCANNING</text>
