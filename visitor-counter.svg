<svg xmlns="http://www.w3.org/2000/svg" width="160" height="44" viewBox="0 0 160 44" role="img" aria-labelledby="title desc">
  <title id="title">Animated visitor telemetry label</title>
  <desc id="desc">A compact cyber-style label for the live profile-view counter shown next to it in the README.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b26"/><stop offset="1" stop-color="#080e15"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61f1da" stop-opacity=".95"/><stop offset=".7" stop-color="#3a8c96" stop-opacity=".58"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".75"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ff3dc" stop-opacity="0"/><stop offset=".5" stop-color="#8bfff0" stop-opacity="1"/><stop offset="1" stop-color="#5ff3dc" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="158" height="42" rx="9" fill="url(#surface)" stroke="#304550" stroke-width="1.4"/>
  <rect x="1.5" y="1.5" width="157" height="41" rx="8.5" fill="none" stroke="url(#rim)" stroke-width="1.1" opacity=".56"><animate attributeName="opacity" values=".38;.86;.38" dur="4.2s" repeatCount="indefinite"/></rect>
  <path d="M8 2H44" stroke="#6ff5df" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>
  <circle cx="12" cy="12" r="2.2" fill="#6bf1db"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="19" y="14.5" fill="#91b1b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6.3" font-weight="700" letter-spacing=".9">PROFILE TELEMETRY</text>
  <text x="10" y="31" fill="#eef7f3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.05">VISITOR LOG</text>
  <text x="10" y="38" fill="#66838b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="5.2" letter-spacing=".6">LIVE PROFILE-VIEW FEED</text>
  <text x="148" y="13.5" text-anchor="end" fill="#7debd6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="5.4" letter-spacing=".6">LIVE</text>
  <circle cx="151" cy="11.5" r="1.3" fill="#7debd6"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></circle>
  <path d="M10 40H110" stroke="#273e47" stroke-width=".8"/>
  <path d="M10 40H37" stroke="url(#trace)" stroke-width="1.2"><animateTransform attributeName="transform" type="translate" values="0 0;72 0;0 0" dur="4.2s" repeatCount="indefinite"/></path>
  <g fill="#58d9c7" opacity=".72">
    <rect x="119" y="29" width="2" height="5" rx="1"/><rect x="124" y="27" width="2" height="7" rx="1"/><rect x="129" y="25" width="2" height="9" rx="1"/><rect x="134" y="28" width="2" height="6" rx="1"/><rect x="139" y="26" width="2" height="8" rx="1"/>
    <animate attributeName="opacity" values=".5;1;.5" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
